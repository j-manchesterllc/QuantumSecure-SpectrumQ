[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ghost-spectrumq"
version = "0.2.0"
description = "GHOST — Post-quantum secure messaging protocol (SpectrumQ)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
dependencies = [
    "cryptography>=41.0",
]

[project.optional-dependencies]
pq = [
    "liboqs-python>=0.10",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
ghost = "ghost.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["ghost*", "lib*"]
